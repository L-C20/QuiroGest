<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>QUIROGEST - Iniciar sesión</title>

    <link rel="stylesheet" href="css/style.css">

</head>


<body class="login-page">


    <main class="login-container">

        <section class="login-card">


            <div class="login-header">

                <div class="logo">

                    <span class="logo-icon">Q</span>

                    <span class="logo-text">
                        QUIROGEST
                    </span>

                </div>

                <p>
                    Gestión del consultorio
                </p>

            </div>


            <form id="loginForm">


                <div class="form-group">

                    <label for="email">
                        Correo electrónico
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="secretaria@consultorio.com"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="password">
                        Contraseña
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="••••••••"
                        required
                    >

                </div>


                <button
                    type="submit"
                    class="btn-primary"
                >
                    Iniciar sesión
                </button>


                <p
                    id="loginError"
                    class="login-error"
                ></p>


            </form>


        </section>


    </main>


    <script src="js/login.js"></script>

</body>

</html>
